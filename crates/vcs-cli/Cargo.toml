[package]
name = "vcs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "svn-next 唯一可执行文件：CLI 客户端 + serve 服务 + server 运维"

# 全 workspace 只有这一个二进制，客户端与服务端能力都以子命令提供。
[[bin]]
name = "vcs"
path = "src/main.rs"

[dependencies]
vcs-core.workspace = true
vcs-server.workspace = true
vcs-grpc.workspace = true
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }

# 只用于把 SIGPIPE 恢复成系统默认：Rust 运行时默认忽略它，
# 于是 `vcs log | head` 这类管道会在 println! 处 panic。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

syntax = "proto3";

package vcs.repo.v1;

// svn-next 通信契约（M0）。本文件是协议的唯一真源。
// 哈希统一为 blake3 的十六进制字符串；字节字段中的对象内容为 zstd 压缩后的数据。
// 生成 Rust 代码：tonic-build + protoc-bin-vendored（M1）。
// 无分支与标签：单一线性主干，不定义 branch / tag / ref 消息或字段，rev 是唯一版本定位方式。
// 提交采用严格 out-of-date 拒绝（ERROR_CODE_OUT_OF_DATE），服务端不做自动合并。

// ---------------- 公共枚举 ----------------

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_BLOB = 1;
  OBJECT_KIND_TREE = 2;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE = 1;
  ENTRY_KIND_DIR = 2;
  ENTRY_KIND_SYMLINK = 3;
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_ADD = 1;
  CHANGE_KIND_MODIFY = 2;
  CHANGE_KIND_DELETE = 3;
  CHANGE_KIND_RENAME = 4;
  CHANGE_KIND_COPY = 5;
}

enum Depth {
  DEPTH_UNSPECIFIED = 0;
  DEPTH_INFINITY = 1;
  DEPTH_IMMEDIATES = 2;
  DEPTH_FILES = 3;
  DEPTH_EMPTY = 4;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_OK = 1;
  ERROR_CODE_OUT_OF_DATE = 2;
  ERROR_CODE_PATH_CONFLICT = 3;
  ERROR_CODE_TREE_CONFLICT = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_QUOTA_EXCEEDED = 6;
  ERROR_CODE_CONTENT_PURGED = 7;
  ERROR_CODE_LOCKED = 8;
  ERROR_CODE_OBJECT_MISSING = 9;
  ERROR_CODE_INVALID_SESSION = 10;
  ERROR_CODE_UNAUTHENTICATED = 11;
  ERROR_CODE_INVALID_CREDENTIALS = 12;
  ERROR_CODE_ACCOUNT_PENDING = 13;
  ERROR_CODE_ACCOUNT_DISABLED = 14;
  ERROR_CODE_REGISTRATION_EXISTS = 15;
  ERROR_CODE_APPROVAL_NOT_FOUND = 16;
  ERROR_CODE_SETUP_TOKEN_INVALID = 17;
  ERROR_CODE_LDAP_UNAVAILABLE = 18;
  ERROR_CODE_TOKEN_EXPIRED = 19;
  ERROR_CODE_PAT_REVOKED = 20;
  ERROR_CODE_REPO_NOT_FOUND = 21;
  ERROR_CODE_REPO_DISABLED = 22;
  ERROR_CODE_REPO_ARCHIVED = 23;
  ERROR_CODE_REPO_NAME_INVALID = 24;
  ERROR_CODE_REPO_CREATION_EXISTS = 25;
  ERROR_CODE_REPO_APPROVAL_NOT_FOUND = 26;
  ERROR_CODE_PASSWORD_POLICY_VIOLATION = 27;
  ERROR_CODE_REPO_NOT_MEMBER = 28;
  ERROR_CODE_REPO_MEMBER_EXISTS = 29;
  ERROR_CODE_REPO_MEMBER_NOT_FOUND = 30;
  ERROR_CODE_REPO_OWNER_PROTECTED = 31;
  ERROR_CODE_REPO_MEMBER_FORBIDDEN = 32;
  ERROR_CODE_USER_NOT_FOUND = 33;
  ERROR_CODE_QUOTA_CONFIG_INVALID = 34;

  // M1 追加：服务端内部 IO 失败（磁盘满、对象损坏、权限不足）。
  // 客户端用它区分「业务拒绝」与「服务端故障」，前者可引导用户自助处理，
  // 后者应直接报错并提示重试。details 中仍带可读原因。
  ERROR_CODE_IO_ERROR = 35;

  // M3 追加：入参本身不合法（拒绝审批必须写原因、scope 不在白名单、
  // 过期时间早于当前时间等）。不能复用 INVALID_SESSION：那会让客户端误判
  // 成"登录态失效"并跳去重新登录。
  ERROR_CODE_INVALID_ARGUMENT = 36;
}

enum GcState {
  GC_STATE_UNSPECIFIED = 0;
  GC_STATE_QUEUED = 1;
  GC_STATE_MARKING = 2;
  GC_STATE_SWEEPING = 3;
  GC_STATE_DONE = 4;
  GC_STATE_FAILED = 5;
}

// ---------------- 公共消息 ----------------

message ObjectRef {
  string hash = 1;
  ObjectKind kind = 2;
  uint64 size = 3;
  uint64 stored_size = 4;
}

message Object {
  string hash = 1;
  ObjectKind kind = 2;
  bytes data = 3;
  bool compressed = 4;
}

message ObjectBatch {
  string session_id = 1;
  repeated Object objects = 2;
}

message TreeEntry {
  string name = 1;
  EntryKind kind = 2;
  string hash = 3;
  uint64 size = 4;
  bytes props = 5;
}

message Tree {
  repeated TreeEntry entries = 1;
}

message Change {
  ChangeKind kind = 1;
  string path = 2;
  string old_hash = 3;
  string new_hash = 4;
  string from_path = 5;
  bytes props = 6;
}

message RevisionInfo {
  uint64 rev = 1;
  string root_tree = 2;
  uint64 parent_rev = 3;
  string author = 4;
  string message = 5;
  int64 committed_at = 6;
  uint32 change_count = 7;
}

message QuotaHint {
  uint64 used_bytes = 1;
  uint64 soft_limit = 2;
  uint64 hard_limit = 3;
  uint64 estimated_new_bytes = 4;
}

// 可清理目录候选，unique_bytes 是删除后真正能回收的字节数。
message PurgeCandidate {
  string path = 1;
  uint64 logical_bytes = 2;
  uint64 unique_bytes = 3;
  uint64 first_seen_rev = 4;
  uint64 last_modified_rev = 5;
}

message DirectoryUsage {
  string path = 1;
  uint64 logical_bytes = 2;
  uint64 unique_bytes = 3;
  uint64 object_count = 4;
  uint64 first_seen_rev = 5;
}

// 所有 RPC 的统一状态；QUOTA_EXCEEDED 时携带 quota 与 candidates，
// 供客户端直接渲染「清理 X 可释放 Y GB → 一键清理 → 重试提交」。
message Status {
  ErrorCode code = 1;
  string message = 2;
  QuotaHint quota = 3;
  repeated PurgeCandidate candidates = 4;
}

// ---------------- 元数据 ----------------

message GetHeadRequest {
  string repo_id = 1;
}

message GetHeadResponse {
  Status status = 1;
  uint64 rev = 2;
  string root_tree = 3;
}

message GetRevisionRequest {
  string repo_id = 1;
  uint64 rev = 2;
}

message GetRevisionResponse {
  Status status = 1;
  RevisionInfo revision = 2;
}

message GetTreeRequest {
  string repo_id = 1;
  uint64 rev = 2;
  repeated string paths = 3;
  Depth depth = 4;
}

message GetTreeResponse {
  Status status = 1;
  string root_tree = 2;
  repeated TreeEntry entries = 3;
}

message GetLogRequest {
  string repo_id = 1;
  uint64 from_rev = 2;
  uint64 to_rev = 3;
  string path_prefix = 4;
  uint32 limit = 5;
}

message GetLogResponse {
  Status status = 1;
  repeated RevisionInfo revisions = 2;
}

// ---------------- 检出与更新 ----------------

message CheckoutRequest {
  string repo_id = 1;
  uint64 rev = 2; // 0 表示 HEAD
  repeated string paths = 3; // 稀疏路径，空表示全部
  Depth depth = 4;
}

message PathRev {
  string path = 1;
  uint64 base_rev = 2;
}

message UpdateRequest {
  string repo_id = 1;
  repeated PathRev bases = 2;
  uint64 target_rev = 3; // 0 表示 HEAD
}

message UpdateResponse {
  Status status = 1;
  uint64 rev = 2;
  repeated Change changes = 3;
  repeated string required_hashes = 4;
}

message ObjectRequest {
  string session_id = 1;
  repeated string hashes = 2;
}

// ---------------- 两阶段提交 ----------------

message BeginCommitRequest {
  string repo_id = 1;
  uint64 base_rev = 2; // FinalizeCommit 严格比较 head_rev，不等即 ERROR_CODE_OUT_OF_DATE
  repeated Change changes = 3;
  string message = 4;
  uint64 estimated_new_bytes = 5; // 用于提交前配额预检
}

message BeginCommitResponse {
  Status status = 1;
  string session_id = 2;
  uint64 head_rev = 3;
  repeated string missing_hashes = 4; // 服务端已有的对象无需重传
}

message PushAck {
  Status status = 1;
  uint64 received_objects = 2;
  uint64 received_bytes = 3;
}

message FinalizeCommitRequest {
  string session_id = 1;
  string message = 2;
}

message FinalizeCommitResponse {
  Status status = 1;
  uint64 rev = 2;
  string root_tree = 3;
  repeated string updated_paths = 4;
}

message AbortCommitRequest {
  string session_id = 1;
}

message AbortCommitResponse {
  Status status = 1;
}

// ---------------- 锁 ----------------

message LockRequest {
  string repo_id = 1;
  repeated string paths = 2;
  uint32 lease_seconds = 3;
}

message LockResponse {
  Status status = 1;
  repeated string tokens = 2;
}

message UnlockRequest {
  string repo_id = 1;
  repeated string paths = 2;
  bool force = 3;
}

message UnlockResponse {
  Status status = 1;
}

// ---------------- 容量治理 ----------------

message GetQuotaRequest {
  string repo_id = 1;
  string path_prefix = 2;
}

message GetQuotaResponse {
  Status status = 1;
  uint64 used_bytes = 2;
  uint64 soft_limit = 3;
  uint64 hard_limit = 4;
  uint64 reclaimable_bytes = 5;
  repeated DirectoryUsage by_path = 6;
  QuotaEffective effective = 7;  // 生效值及其来源
}

message ListPurgeCandidatesRequest {
  string repo_id = 1;
  uint32 limit = 2;
}

message ListPurgeCandidatesResponse {
  Status status = 1;
  repeated PurgeCandidate candidates = 2;
}

message EstimatePurgeRequest {
  string repo_id = 1;
  repeated string paths = 2;
}

message EstimatePurgeResponse {
  Status status = 1;
  uint64 reclaimable_bytes = 2;
  uint64 affected_revisions = 3;
  repeated string shared_paths = 4; // 与其它目录共享、不会被回收的部分
}

message PurgeRequest {
  string repo_id = 1;
  repeated string paths = 2;
  bool immediate = 3; // 跳过回收站宽限期，立即触发 GC
  string reason = 4;
}

message PurgeResponse {
  Status status = 1;
  uint64 purge_id = 2;
  uint64 new_rev = 3;
  string gc_job_id = 4;
}

// 已执行的清理记录（回收站）。撤销后 state 变 REVERTED，GC 不再跳过这些路径。
message PurgedPathInfo {
  string purge_id = 1;
  string path = 2;
  string state = 3;              // pending / active / reverted
  string reason = 4;
  string purged_by = 5;
  int64 created_at = 6;
  int64 grace_until = 7;         // 0 表示已激活（无宽限期）
  int64 activated_at = 8;
}

message ListPurgedPathsRequest {
  string repo_id = 1;
}

message ListPurgedPathsResponse {
  Status status = 1;
  repeated PurgedPathInfo entries = 2;
}

// 撤销清理：把路径恢复到 HEAD，并把裁剪标记置为 reverted。
// 内容若已被 GC 物理回收则无法恢复，返回 ERROR_CODE_CONTENT_PURGED。
message RevertPurgeRequest {
  string repo_id = 1;
  string purge_id = 2;
}

message RevertPurgeResponse {
  Status status = 1;
  uint64 new_rev = 2;
}

// ---------------- 保留策略 ----------------

// 按目录模式自动清理：keep_months / max_bytes / max_age_days 任一被违反即成为候选。
// path_pattern 是正则，匹配仓库顶层目录名（例如 ^20\\d{4}$）。
message RetentionPolicyInfo {
  string policy_id = 1;
  string path_pattern = 2;
  uint32 keep_months = 3;     // 0 表示不限制
  uint64 max_bytes = 4;       // 0 表示不限制
  uint32 max_age_days = 5;    // 0 表示不限制
  bool enabled = 6;
  bool dry_run = 7;           // true 表示只报告、不执行
  int64 created_at = 8;
}

message ListRetentionPoliciesRequest {
  string repo_id = 1;
}

message ListRetentionPoliciesResponse {
  Status status = 1;
  repeated RetentionPolicyInfo policies = 2;
}

message UpsertRetentionPolicyRequest {
  string repo_id = 1;
  string policy_id = 2;       // 空表示新建
  string path_pattern = 3;
  uint32 keep_months = 4;
  uint64 max_bytes = 5;
  uint32 max_age_days = 6;
  bool enabled = 7;
  bool dry_run = 8;
}

message UpsertRetentionPolicyResponse {
  Status status = 1;
  RetentionPolicyInfo policy = 2;
}

message DeleteRetentionPolicyRequest {
  string repo_id = 1;
  string policy_id = 2;
}

message DeleteRetentionPolicyResponse {
  Status status = 1;
}

// 执行一次策略评估。dry_run=true 时只返回候选，不改动任何数据。
message ApplyRetentionRequest {
  string repo_id = 1;
  bool dry_run = 2;
  bool immediate = 3;         // 执行时是否跳过回收站宽限期
}

message ApplyRetentionResponse {
  Status status = 1;
  repeated string candidates = 2;
  uint64 reclaimable_bytes = 3;
  uint64 new_rev = 4;         // 0 表示没有产生提交（dry-run 或没有候选）
}

message GetGcStatusRequest {
  string repo_id = 1;
  string job_id = 2;
}

message GetGcStatusResponse {
  Status status = 1;
  GcState state = 2;
  uint32 progress_percent = 3;
  uint64 marked_objects = 4;
  uint64 swept_objects = 5;
  uint64 reclaimed_bytes = 6;
  string error = 7;
}

// ---------------- 用户体系 ----------------

enum AuthSource {
  AUTH_SOURCE_UNSPECIFIED = 0;
  AUTH_SOURCE_LOCAL = 1;
  AUTH_SOURCE_LDAP = 2;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_PENDING = 1;
  ACCOUNT_STATUS_ACTIVE = 2;
  ACCOUNT_STATUS_DISABLED = 3;
  ACCOUNT_STATUS_REJECTED = 4;
  ACCOUNT_STATUS_EXPIRED = 5;
}

enum RegistrationStatus {
  REGISTRATION_STATUS_UNSPECIFIED = 0;
  REGISTRATION_STATUS_PENDING = 1;
  REGISTRATION_STATUS_APPROVED = 2;
  REGISTRATION_STATUS_REJECTED = 3;
  REGISTRATION_STATUS_EXPIRED = 4;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_READONLY = 1;
  ROLE_WRITER = 2;
  ROLE_ADMIN = 3;
}

message UserInfo {
  string user_id = 1;
  string username = 2;
  string display_name = 3;  // 姓名
  reserved 4;               // 原 email 已移除，编号不复用
  AuthSource source = 5;
  AccountStatus status = 6;
  Role role = 7;
  int64 last_login_at = 8;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  AuthSource source = 3;
}

message LoginResponse {
  Status status = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_at = 4;
  UserInfo user = 5;
}

// 免认证接口：提交申请，账号处于 PENDING，不能登录。
message RegisterRequest {
  string username = 1;
  string display_name = 2;  // 姓名
  reserved 3;               // 原 email 已移除，编号不复用
  string reason = 4;
}

message RegisterResponse {
  Status status = 1;
  string request_id = 2;
  RegistrationStatus state = 3;
}

message RegistrationInfo {
  string request_id = 1;
  string username = 2;
  string display_name = 3;  // 姓名
  reserved 4;               // 原 email 已移除，编号不复用
  string reason = 5;
  RegistrationStatus state = 6;
  int64 submitted_at = 7;
  int64 decided_at = 8;
  string decided_by = 9;
  string decision_note = 10;
}

message GetRegistrationRequest {
  string request_id = 1;
}

message GetRegistrationResponse {
  Status status = 1;
  RegistrationInfo request = 2;
}

message ListRegistrationsRequest {
  RegistrationStatus filter = 1;
  uint32 limit = 2;
}

message ListRegistrationsResponse {
  Status status = 1;
  repeated RegistrationInfo requests = 2;
}

message ApproveRegistrationRequest {
  string request_id = 1;
  Role role = 2;
}

message ApproveRegistrationResponse {
  Status status = 1;
  string user_id = 2;
  // 一次性设置密码 token，仅此一次返回；注册表单不收集密码。
  string password_setup_token = 3;
  int64 setup_token_expires_at = 4;
}

message RejectRegistrationRequest {
  string request_id = 1;
  string reason = 2;
}

message RejectRegistrationResponse {
  Status status = 1;
}

message SetPasswordRequest {
  string setup_token = 1;
  string new_password = 2;
}

message SetPasswordResponse {
  Status status = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  Status status = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_at = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  Status status = 1;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  Status status = 1;
  UserInfo user = 2;
}

message PatInfo {
  string token_id = 1;
  string name = 2;
  repeated string scopes = 3;
  int64 created_at = 4;
  int64 expires_at = 5;
  int64 revoked_at = 6;
  int64 last_used_at = 7;
}

message CreatePatRequest {
  string name = 1;
  repeated string scopes = 2;
  int64 expires_at = 3;
}

message CreatePatResponse {
  Status status = 1;
  string token = 2; // 明文只返回一次，库里只存哈希
  string token_id = 3;
}

message ListPatsRequest {}

message ListPatsResponse {
  Status status = 1;
  repeated PatInfo tokens = 2;
}

message RevokePatRequest {
  string token_id = 1;
}

message RevokePatResponse {
  Status status = 1;
}

// 读取时不含 bind 密码；写入时单独传入并加密落库。
message LdapConfig {
  string host = 1;
  uint32 port = 2;
  string tls_mode = 3;
  string base_dn = 4;
  string bind_dn = 5;
  string user_filter = 6;
  string group_filter = 7;
  string attr_username = 8;
  reserved 9;                      // 原 attr_email 已移除，编号不复用
  string attr_display_name = 10;  // 姓名
  bool enabled = 11;
}

message GetLdapConfigRequest {}

message GetLdapConfigResponse {
  Status status = 1;
  LdapConfig config = 2;
}

message UpdateLdapConfigRequest {
  LdapConfig config = 1;
  string bind_password = 2;
}

message UpdateLdapConfigResponse {
  Status status = 1;
}

message TestLdapConnectionRequest {
  LdapConfig config = 1;
  string bind_password = 2;
}

message TestLdapConnectionResponse {
  Status status = 1;
  string bound_dn = 2;
  uint32 user_count_sample = 3;
}

message SetUserStatusRequest {
  string user_id = 1;
  AccountStatus status = 2;
}

message SetUserStatusResponse {
  Status status = 1;
}

message SetUserRoleRequest {
  string user_id = 1;
  Role role = 2;
}

message SetUserRoleResponse {
  Status status = 1;
}

// ---------------- 仓库创建与审批 ----------------

enum RepoStatus {
  REPO_STATUS_UNSPECIFIED = 0;
  REPO_STATUS_ACTIVE = 1;
  REPO_STATUS_DISABLED = 2;
  REPO_STATUS_ARCHIVED = 3;
}

enum RepoCreationStatus {
  REPO_CREATION_STATUS_UNSPECIFIED = 0;
  REPO_CREATION_STATUS_PENDING = 1;
  REPO_CREATION_STATUS_APPROVED = 2;
  REPO_CREATION_STATUS_REJECTED = 3;
  REPO_CREATION_STATUS_EXPIRED = 4;
}

message RepoInfo {
  string repo_id = 1;
  string name = 2;
  RepoStatus status = 3;
  string owner_user_id = 4;
  uint64 head_rev = 5;
  uint64 quota_soft_bytes = 6;
  uint64 quota_hard_bytes = 7;
  int64 created_at = 8;
}

message RepoCreationInfo {
  string request_id = 1;
  string requester_user_id = 2;
  string repo_name = 3;
  string repo_id_hint = 4;
  string reason = 5;
  uint64 requested_quota_bytes = 6;
  RepoCreationStatus state = 7;
  int64 submitted_at = 8;
  int64 decided_at = 9;
  string decided_by = 10;
  string decision_note = 11;
  int64 expires_at = 12;
  string approved_repo_id = 13;
}

message RequestRepoRequest {
  string repo_name = 1;
  string repo_id_hint = 2;
  string reason = 3;
  uint64 requested_quota_bytes = 4;
}

message RequestRepoResponse {
  Status status = 1;
  string request_id = 2;
  RepoCreationStatus state = 3;
}

message GetRepoCreationRequest {
  string request_id = 1;
}

message GetRepoCreationResponse {
  Status status = 1;
  RepoCreationInfo request = 2;
}

message ListRepoCreationsRequest {
  RepoCreationStatus filter = 1;
  uint32 limit = 2;
}

message ListRepoCreationsResponse {
  Status status = 1;
  repeated RepoCreationInfo requests = 2;
}

message ApproveRepoCreationRequest {
  string request_id = 1;
  uint64 quota_soft_bytes = 2;  // 0 表示不核定，继承全局默认配额
  uint64 quota_hard_bytes = 3;  // 0 表示不核定，继承全局默认配额
  string decision_note = 4;
}

message ApproveRepoCreationResponse {
  Status status = 1;
  RepoInfo repo = 2;
}

message RejectRepoCreationRequest {
  string request_id = 1;
  string reason = 2;
}

message RejectRepoCreationResponse {
  Status status = 1;
}

message ListReposRequest {
  RepoStatus filter = 1;
}

message ListReposResponse {
  Status status = 1;
  repeated RepoInfo repos = 2;
}

message GetRepoQuery {
  string repo_id = 1;
}

message GetRepoResponse {
  Status status = 1;
  RepoInfo repo = 2;
}

message SetRepoStatusRequest {
  string repo_id = 1;
  RepoStatus status = 2;
}

message SetRepoStatusResponse {
  Status status = 1;
}

// 管理员直通：跳过审批，用于首次部署、迁移与自动化测试，同样写审计日志。
message CreateRepoDirectRequest {
  string repo_name = 1;
  string repo_id_hint = 2;
  uint64 quota_soft_bytes = 3;
  uint64 quota_hard_bytes = 4;
}

message CreateRepoDirectResponse {
  Status status = 1;
  RepoInfo repo = 2;
}

// ---------------- 仓库成员 ----------------

enum RepoMemberRole {
  REPO_MEMBER_ROLE_UNSPECIFIED = 0;
  REPO_MEMBER_ROLE_OWNER = 1;
  REPO_MEMBER_ROLE_MAINTAINER = 2;
  REPO_MEMBER_ROLE_WRITER = 3;
  REPO_MEMBER_ROLE_READER = 4;
}

message RepoMemberInfo {
  string repo_id = 1;
  string user_id = 2;
  string username = 3;
  string display_name = 4;
  RepoMemberRole role = 5;
  string added_by = 6;
  int64 added_at = 7;
}

message ListMembersRequest {
  string repo_id = 1;
}

message ListMembersResponse {
  Status status = 1;
  repeated RepoMemberInfo members = 2;
}

message AddMemberRequest {
  string repo_id = 1;
  string user_id = 2;
  RepoMemberRole role = 3;
}

message AddMemberResponse {
  Status status = 1;
  RepoMemberInfo member = 2;
}

message RemoveMemberRequest {
  string repo_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {
  Status status = 1;
}

message SetMemberRoleRequest {
  string repo_id = 1;
  string user_id = 2;
  RepoMemberRole role = 3;
}

message SetMemberRoleResponse {
  Status status = 1;
  RepoMemberInfo member = 2;
}

// 按用户名查找可添加的 ACTIVE 用户，只返回用户名与姓名。
message SearchUsersRequest {
  string query = 1;
  uint32 limit = 2;
}

message UserSummary {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
}

message SearchUsersResponse {
  Status status = 1;
  repeated UserSummary users = 2;
}

// ---------------- 配额配置 ----------------

enum QuotaSource {
  QUOTA_SOURCE_UNSPECIFIED = 0;
  QUOTA_SOURCE_REPO_OVERRIDE = 1;
  QUOTA_SOURCE_GLOBAL_DEFAULT = 2;
  QUOTA_SOURCE_FALLBACK = 3;
}

message QuotaDefaults {
  uint64 soft_bytes = 1;
  uint64 hard_bytes = 2;
  int64 updated_at = 3;
  string updated_by = 4;
}

message QuotaEffective {
  uint64 soft_bytes = 1;
  uint64 hard_bytes = 2;
  QuotaSource source = 3;
}

message GetQuotaDefaultsRequest {}

message GetQuotaDefaultsResponse {
  Status status = 1;
  QuotaDefaults defaults = 2;
  QuotaEffective fallback = 3;
}

message UpdateQuotaDefaultsRequest {
  uint64 soft_bytes = 1;
  uint64 hard_bytes = 2;
}

message UpdateQuotaDefaultsResponse {
  Status status = 1;
  QuotaDefaults defaults = 2;
}

message GetRepoQuotaRequest {
  string repo_id = 1;
}

message GetRepoQuotaResponse {
  Status status = 1;
  uint64 repo_soft_bytes = 2;  // 0 表示继承全局默认
  uint64 repo_hard_bytes = 3;
  QuotaDefaults defaults = 4;
  QuotaEffective effective = 5;
}

message SetRepoQuotaRequest {
  string repo_id = 1;
  uint64 soft_bytes = 2;
  uint64 hard_bytes = 3;
  bool inherit = 4;  // true 时清零并恢复继承全局默认
}

message SetRepoQuotaResponse {
  Status status = 1;
  QuotaEffective effective = 2;
}

// ---------------- 服务 ----------------

service RepoService {
  rpc GetHead(GetHeadRequest) returns (GetHeadResponse);
  rpc GetRevision(GetRevisionRequest) returns (GetRevisionResponse);
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse);
  rpc GetLog(GetLogRequest) returns (GetLogResponse);

  rpc Checkout(CheckoutRequest) returns (stream ObjectBatch);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc FetchObjects(stream ObjectRequest) returns (stream ObjectBatch);

  rpc BeginCommit(BeginCommitRequest) returns (BeginCommitResponse);
  rpc PushObjects(stream ObjectBatch) returns (PushAck);
  rpc FinalizeCommit(FinalizeCommitRequest) returns (FinalizeCommitResponse);
  rpc AbortCommit(AbortCommitRequest) returns (AbortCommitResponse);

  rpc Lock(LockRequest) returns (LockResponse);
  rpc Unlock(UnlockRequest) returns (UnlockResponse);

  rpc GetQuota(GetQuotaRequest) returns (GetQuotaResponse);
  rpc ListPurgeCandidates(ListPurgeCandidatesRequest) returns (ListPurgeCandidatesResponse);
  rpc EstimatePurge(EstimatePurgeRequest) returns (EstimatePurgeResponse);
  rpc Purge(PurgeRequest) returns (PurgeResponse);
  rpc GetGcStatus(GetGcStatusRequest) returns (GetGcStatusResponse);
  rpc ListPurgedPaths(ListPurgedPathsRequest) returns (ListPurgedPathsResponse);
  rpc RevertPurge(RevertPurgeRequest) returns (RevertPurgeResponse);
  rpc ListRetentionPolicies(ListRetentionPoliciesRequest) returns (ListRetentionPoliciesResponse);
  rpc UpsertRetentionPolicy(UpsertRetentionPolicyRequest) returns (UpsertRetentionPolicyResponse);
  rpc DeleteRetentionPolicy(DeleteRetentionPolicyRequest) returns (DeleteRetentionPolicyResponse);
  rpc ApplyRetention(ApplyRetentionRequest) returns (ApplyRetentionResponse);
}

// 用户体系：Register / SetPassword 免认证，其余按角色鉴权。
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc GetRegistration(GetRegistrationRequest) returns (GetRegistrationResponse);
  rpc ListRegistrations(ListRegistrationsRequest) returns (ListRegistrationsResponse);
  rpc ApproveRegistration(ApproveRegistrationRequest) returns (ApproveRegistrationResponse);
  rpc RejectRegistration(RejectRegistrationRequest) returns (RejectRegistrationResponse);
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  rpc CreatePat(CreatePatRequest) returns (CreatePatResponse);
  rpc ListPats(ListPatsRequest) returns (ListPatsResponse);
  rpc RevokePat(RevokePatRequest) returns (RevokePatResponse);
  rpc GetLdapConfig(GetLdapConfigRequest) returns (GetLdapConfigResponse);
  rpc UpdateLdapConfig(UpdateLdapConfigRequest) returns (UpdateLdapConfigResponse);
  rpc TestLdapConnection(TestLdapConnectionRequest) returns (TestLdapConnectionResponse);
  rpc SetUserStatus(SetUserStatusRequest) returns (SetUserStatusResponse);
  rpc SetUserRole(SetUserRoleRequest) returns (SetUserRoleResponse);
}

// 仓库创建与审批：RequestRepo 面向所有 ACTIVE 用户，
// Approve / Reject / CreateRepoDirect / SetRepoStatus 仅限全局 admin。
service RepoAdminService {
  rpc RequestRepo(RequestRepoRequest) returns (RequestRepoResponse);
  rpc GetRepoCreation(GetRepoCreationRequest) returns (GetRepoCreationResponse);
  rpc ListRepoCreations(ListRepoCreationsRequest) returns (ListRepoCreationsResponse);
  rpc ApproveRepoCreation(ApproveRepoCreationRequest) returns (ApproveRepoCreationResponse);
  rpc RejectRepoCreation(RejectRepoCreationRequest) returns (RejectRepoCreationResponse);
  rpc CreateRepoDirect(CreateRepoDirectRequest) returns (CreateRepoDirectResponse);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc GetRepo(GetRepoQuery) returns (GetRepoResponse);
  rpc SetRepoStatus(SetRepoStatusRequest) returns (SetRepoStatusResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse);
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  rpc GetQuotaDefaults(GetQuotaDefaultsRequest) returns (GetQuotaDefaultsResponse);
  rpc UpdateQuotaDefaults(UpdateQuotaDefaultsRequest) returns (UpdateQuotaDefaultsResponse);
  rpc GetRepoQuota(GetRepoQuotaRequest) returns (GetRepoQuotaResponse);
  rpc SetRepoQuota(SetRepoQuotaRequest) returns (SetRepoQuotaResponse);
}
